
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>How-to Guides | Apps365</title>

    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
</head>

<body>
    <main class="how-to-section">

        <div class="how-to-header">
            <div class="how-to-heading">
                <span class="how-to-label">
                    APPS365 KNOWLEDGE BASE
                </span>

                <h1 id="pageTitle">How-to Guides</h1>

                <p id="pageDescription">
                    Step-by-step tutorials and product guides.
                </p>
            </div>

            <div class="how-to-search">
                <input
                    type="search"
                    id="articleSearch"
                    placeholder="Search guides..."
                    aria-label="Search articles"
                >
            </div>
        </div>

        <div class="how-to-toolbar">
            <span id="articleCount" role="status">
                Loading articles...
            </span>
        </div>

        <div class="how-to-grid" id="articlesContainer">
        </div>

        <div class="how-to-empty" id="emptyMessage" hidden>
            <h2>No Guides Found</h2>
            <p id="emptyDescription">
                No matching articles are available.
            </p>
        </div>

    </main>

    <!-- Article Popup -->
    <div
        class="article-modal"
        id="articleModal"
        hidden
    >
        <div
            class="article-modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle"
        >
            <div class="article-modal-header">
                <h2 id="modalTitle">Article</h2>

                <button
                    type="button"
                    id="closeModal"
                    aria-label="Close article"
                >
                    &times;
                </button>
            </div>

            <iframe
                id="articleFrame"
                title="Knowledge Base Article"
                sandbox=""
                referrerpolicy="no-referrer"
            ></iframe>
        </div>
    </div>
</body>
</html>
